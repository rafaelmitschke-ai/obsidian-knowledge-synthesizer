<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    :root {
      --bg-gradient: linear-gradient(135deg, #0b0816, #030107);
      --color-primary: #6366f1;
      --color-accent: #a855f7;
      --color-success: #10b981;
      --color-error: #ef4444;
      --text-primary: #f8fafc;
      --text-secondary: #94a3b8;
      --border-glass: rgba(255, 255, 255, 0.08);
      --bg-glass: rgba(255, 255, 255, 0.03);
    }

    body {
      width: 320px;
      margin: 0;
      padding: 16px;
      background: var(--bg-gradient);
      color: var(--text-primary);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-size: 14px;
      overflow-x: hidden;
    }

    h3 {
      margin: 0 0 4px 0;
      font-size: 16px;
      font-weight: 700;
      background: linear-gradient(135deg, var(--text-primary), var(--text-secondary));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .subtitle {
      font-size: 11px;
      color: var(--text-secondary);
      margin-bottom: 12px;
      display: block;
    }

    .glass-panel {
      background: var(--bg-glass);
      border: 1px solid var(--border-glass);
      border-radius: 12px;
      padding: 12px;
      backdrop-filter: blur(12px);
      margin-bottom: 12px;
    }

    .btn {
      width: 100%;
      background: linear-gradient(135deg, var(--color-primary), var(--color-accent));
      color: white;
      border: none;
      padding: 10px 14px;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      font-size: 13px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.2s ease-in-out;
      box-shadow: 0 4px 12px rgba(99, 102, 241, 0.2);
    }

    .btn:hover {
      opacity: 0.95;
      transform: translateY(-1px);
    }

    .btn:active {
      transform: translateY(0);
    }

    .btn:disabled {
      background: rgba(255, 255, 255, 0.1);
      color: var(--text-secondary);
      cursor: not-allowed;
      box-shadow: none;
      transform: none;
    }

    .info-row {
      display: flex;
      flex-direction: column;
      gap: 4px;
      font-size: 12px;
    }

    .label {
      color: var(--text-secondary);
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .value {
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .toast {
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 12px;
      display: none;
      animation: fadeIn 0.3s ease-in-out;
      line-height: 1.4;
    }

    .toast-success {
      background: rgba(16, 185, 129, 0.15);
      border: 1px solid rgba(16, 185, 129, 0.3);
      color: var(--color-success);
    }

    .toast-error {
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid rgba(239, 68, 68, 0.3);
      color: var(--color-error);
    }

    .footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 11px;
      color: var(--text-secondary);
      margin-top: 12px;
    }

    .settings-btn {
      background: transparent;
      border: none;
      color: var(--text-secondary);
      cursor: pointer;
      padding: 4px;
      display: flex;
      align-items: center;
      transition: color 0.2s;
    }

    .settings-btn:hover {
      color: var(--text-primary);
    }

    #settings-panel {
      display: none;
      animation: slideDown 0.2s ease-in-out;
    }

    .input-field {
      width: 100%;
      background: rgba(0, 0, 0, 0.2);
      border: 1px solid var(--border-glass);
      border-radius: 6px;
      padding: 6px 10px;
      color: white;
      font-size: 12px;
      margin-top: 4px;
      box-sizing: border-box;
    }

    .input-field:focus {
      outline: none;
      border-color: var(--color-primary);
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes slideDown {
      from { opacity: 0; max-height: 0; }
      to { opacity: 1; max-height: 100px; }
    }
  </style>
</head>
<body>
  <h3>🔌 Aetheris Clipper</h3>
  <span class="subtitle">Wissen direkt in die Warteschlange einfügen</span>

  <div class="glass-panel info-row">
    <div>
      <span class="label">Aktive Seite</span>
      <div id="page-title" class="value">Erkenne Seite...</div>
    </div>
    <div style="margin-top: 6px;">
      <span class="label">Typ</span>
      <div id="page-type" class="value">-</div>
    </div>
  </div>

  <div id="toast" class="toast"></div>

  <button id="clip-btn" class="btn" style="margin-top: 8px;">
    ⚡ Wissen clippen
  </button>

  <div id="settings-panel" class="glass-panel" style="margin-top: 12px; padding: 10px;">
    <span class="label">Aetheris Server URL</span>
    <input type="text" id="server-url" class="input-field" placeholder="http://localhost:5001">
  </div>

  <div class="footer">
    <span>v1.0 (Local Sync)</span>
    <button id="toggle-settings" class="settings-btn" title="Einstellungen">
      ⚙️ Einstellungen
    </button>
  </div>

  <script src="popup.js"></script>
</body>
</html>
